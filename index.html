<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Organizer</title>
<style>
body{font-family:Arial;background:#fff7ed;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #fdba74;border-radius:8px}
textarea{height:100px}
button{background:#ea580c;color:white;border:0;padding:11px 17px;border-radius:7px;cursor:pointer}
.recipe{background:#ffedd5;padding:15px;margin-top:12px;border-radius:9px}
</style>
</head>
<body>
<main>
<h1>Recipe Organizer</h1>
<p>Save and organize your favorite recipes.</p>
<input id="title" placeholder="Recipe name">
<textarea id="ingredients" placeholder="Ingredients"></textarea>
<textarea id="instructions" placeholder="Cooking instructions"></textarea>
<button onclick="addRecipe()">Save Recipe</button>
<p id="status"></p>
<h2>My Recipes</h2>
<div id="recipes"></div>
</main>
<script>
let recipes=JSON.parse(localStorage.getItem("recipes")||"[]");
function save(){
 localStorage.setItem("recipes",JSON.stringify(recipes));
 render();
}
function addRecipe(){
 const title=document.getElementById("title").value.trim();
 const ingredients=document.getElementById("ingredients").value.trim();
 const instructions=document.getElementById("instructions").value.trim();
 const status=document.getElementById("status");
 if(!title||!ingredients||!instructions){
  status.textContent="Please complete all fields.";
  return;
 }
 recipes.unshift({title,ingredients,instructions});
 document.getElementById("title").value="";
 document.getElementById("ingredients").value="";
 document.getElementById("instructions").value="";
 status.textContent="Recipe saved successfully!";
 save();
}
function render(){
 const list=document.getElementById("recipes");
 list.innerHTML="";
 recipes.forEach((r,i)=>{
  const card=document.createElement("div");
  card.className="recipe";
  const h=document.createElement("h3");
  h.textContent=r.title;
  const p=document.createElement("p");
  p.textContent="Ingredients: "+r.ingredients;
  const d=document.createElement("p");
  d.textContent="Instructions: "+r.instructions;
  const btn=document.createElement("button");
  btn.textContent="Delete";
  btn.onclick=()=>{recipes.splice(i,1);save();};
  card.append(h,p,d,btn);
  list.appendChild(card);
 });
}
render();
</script>
</body>
</html>
